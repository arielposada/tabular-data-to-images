[project]
name = "tabular-data-to-images"
version = "0.1.0"
description = "Experiments converting tabular data into image representations for CNN-based classification"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
dependencies = [
    "setuptools<81", # provides pkg_resources (removed in newer setuptools), used by tabgan
    "pandas",
    "numpy<2", # pyarrow<15 (needed for be-great/tabgan's `datasets` dep) is built against numpy 1.x ABI
    "scikit-learn==1.6.1", # pinned: RFE has a tag issue, incompatible with newer versions
    "matplotlib",
    "seaborn",
    "tqdm",
    "joblib",
    "torch",
    "torchvision",
    "xgboost",
    "tabpfn",
    "tabpfn-extensions @ git+https://github.com/priorlabs/tabpfn-extensions.git",
    "pyDeepInsight[cam,ags] @ git+https://github.com/alok-ai-lab/pyDeepInsight.git", # [cam,ags] extras are unconditionally imported by pyDeepInsight itself, not actually optional
    "opencv-python", # pyDeepInsight imports cv2 but doesn't declare it as a dependency at all (not even under an extra)
    "optuna",
    "umap-learn",
    "fancyimpute", # used by refined/Toolbox.py (vendored REFINED algorithm)
    "shap",
    "tf-keras",
    "be-great",
    "tabgan",
    "pyarrow<15", # datasets (pulled in by be-great/tabgan) still needs pa.PyExtensionType, removed in pyarrow>=15
    "sentencepiece",
    "kagglehub",
    "ipykernel",
    "jupyter",
    "ipywidgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_data_to_images"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
